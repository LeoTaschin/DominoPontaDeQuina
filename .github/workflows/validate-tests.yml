name: Executa testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj

      - name: Build
        run: dotnet build DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj --configuration Release --no-restore

      # Codigo ja implementado: uma falha aqui quebra a pipeline de proposito.
      - name: Testes de autenticacao
        run: >-
          dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj
          --configuration Release --no-build --verbosity minimal
          --filter "FullyQualifiedName~DominoPontaDeQuina.Tests.Autenticacao"

      # O Core ainda e exercicio em aberto (metodos com NotImplementedException),
      # entao estas falhas sao esperadas e nao devem bloquear a pipeline.
      - name: Testes do Core (exercicio em aberto)
        continue-on-error: true
        run: >-
          dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj
          --configuration Release --no-build --verbosity minimal
          --filter "FullyQualifiedName!~DominoPontaDeQuina.Tests.Autenticacao"
